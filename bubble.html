<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            border: 2px solid red;
            margin: 2px;
        }

        section {
            border: 2px solid green;
            margin: 2px;
        }

        ol {
            border: 2px solid purple;
            margin: 2px;
        }

        li {
            border: 2px solid blue;
            margin: 2px;
        }
    </style>
</head>

<body id="body">
    <h1>Explore event bubble</h1>
    <section id="section-1">
        <h3>List of think</h3>
        <!-- ul>li#item-$*6>lorem2 -->
        <ol id="item-list">
            <li id="item-1">Lorem, ipsum.</li>
            <li id="item-2">Sequi, porro.</li>
            <li id="item-3">Eveniet, omnis?</li>
            <li id="item-4">Voluptatum, repellendus.</li>
            <li id="item-5">Autem, inventore!</li>
            <li id="item-6">A, cumque.</li>
        </ol>
    </section>

    <script>
        //list item 2 click handler
        document.getElementById('item-2')
            .addEventListener('click', function () {
                console.log('item 2 clicked');
            })

        //list item 2 click handler
        document.getElementById('item-list')
            .addEventListener('click', function () {
                console.log('ol clicked');
            })

        //section click handler
        document.getElementById('section-1')
            .addEventListener('click', function () {
                console.log('section clicked');
            })

        // body click handler
        document.getElementById('body')
            .addEventListener('click', function () {
                console.log('body clicked');
            })
    </script>
</body>

</html>
