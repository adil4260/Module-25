<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Handler </title>
</head>

<body>
    <h1 id="title-text">Event Handler</h1>
    <button id="btn-update-title">Update title</button>
    <script>
        document.getElementById('btn-update-title')
            .addEventListener('click', function () { //bitore function are name dileao pari chaila
                console.log('I am clicked')
                const titleElement = document.getElementById('title-text');
                titleElement.innerText = 'I am clicked';
            })
    </script>
    <br>
    <br>


    <script src="js/handler.js"></script>
</body>

</html>
